<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение email</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      text-align: center;
      color: #222;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .tab {
      flex: 1;
      min-width: 110px;
      padding: 10px;
      border: 1px solid #d9dee3;
      border-radius: 8px;
      background: #f8f9fa;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
      color: #444;
      transition: 0.2s;
      user-select: none;
    }

    .tab.active {
      background: #0d6efd;
      border-color: #0d6efd;
      color: #fff;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    select,
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd6dd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      background: #fff;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: #0d6efd;
      color: white;
      font-weight: bold;
    }

    .btn-primary:disabled {
      background: #b9c6d3;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
      margin-top: 10px;
    }

    .btn-success {
      background: #198754;
      color: white;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .confirm-box {
      background: #f8f9fa;
      border: 1px solid #e0e5ea;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .confirm-row {
      margin-bottom: 10px;
      font-size: 17px;
      color: #222;
    }

    .confirm-label {
      font-weight: bold;
    }

    .success-box {
      text-align: center;
      padding: 10px 0;
    }

    .success-title {
      color: #198754;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .note {
      margin-top: 14px;
      font-size: 13px;
      color: #6c757d;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Подтверждение email</h1>

    <!-- Форма выбора -->
    <div id="formView">
      <div class="tabs">
        <div class="tab active" data-group="3ИСиП-24">3ИСиП-24</div>
        <div class="tab" data-group="3КСК-24">3КСК-24</div>
        <div class="tab" data-group="3РЗ-24">3РЗ-24</div>
      </div>

      <div class="form-group">
        <label for="studentSelect">Ваши ФИО</label>
        <select id="studentSelect">
          <option value="">-- Выберите ФИО --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="emailInput">Ваш email</label>
        <input
          type="email"
          id="emailInput"
          placeholder="example@mail.ru"
          autocomplete="email"
        >
      </div>

      <button id="nextBtn" class="btn-primary" disabled>Далее</button>

      <div class="note">
        После ввода данных нажмите «Далее» и проверьте информацию перед отправкой.
      </div>
    </div>

    <!-- Подтверждение -->
    <div id="confirmView" class="hidden">
      <div class="confirm-box">
        <div class="confirm-row">
          <span class="confirm-label">Ваше ФИО:</span>
          <span id="confirmName"></span>
        </div>

        <div class="confirm-row">
          <span class="confirm-label">Ваш Email:</span>
          <span id="confirmEmail"></span>
        </div>
      </div>

      <button id="submitBtn" class="btn-primary">Отправить</button>
      <button id="backBtn" class="btn-secondary">Назад</button>
    </div>

    <!-- Успех -->
    <div id="successView" class="hidden">
      <div class="success-box">
        <div class="success-title">Данные успешно отправлены</div>
        <button id="resetBtn" class="btn-success">Заполнить заново</button>
      </div>
    </div>
  </div>

    { id: "29", name: "ЦВЕТИНСКИХ Александр Константинович" },

    let currentGroup = "3ИСиП-24";
    let currentStudents = [];
    let selectedStudent = null;

    const tabs = document.querySelectorAll(".tab");

    const formView = document.getElementById("formView");
    const confirmView = document.getElementById("confirmView");
    const successView = document.getElementById("successView");

    const studentSelect = document.getElementById("studentSelect");
    const emailInput = document.getElementById("emailInput");

    const nextBtn = document.getElementById("nextBtn");
    const backBtn = document.getElementById("backBtn");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");

    const confirmName = document.getElementById("confirmName");
    const confirmEmail = document.getElementById("confirmEmail");


    function normalizeStudents(group) {
      const rawList = STUDENTS[group] || [];

      return rawList.map((item, index) => {
        // Если вдруг вы запишете просто строками:
        // ["Иванов Иван Иванович", "Петров Пётр Петрович"]
        if (typeof item === "string") {
          return {
            id: item,
            name: item
          };
        }

        return {
          id: String(item.id ?? item.number ?? item.num ?? item.name ?? index + 1),
          name: String(item.name ?? item.fio ?? item.fullName ?? "")
        };
      }).filter(item => item.name.trim() !== "");
    }


    function renderStudents() {
      currentStudents = normalizeStudents(currentGroup);
      selectedStudent = null;

      studentSelect.innerHTML = '<option value="">-- Выберите ФИО --</option>';

      currentStudents.forEach((student, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = student.name;
        studentSelect.appendChild(option);
      });

      validateForm();
    }


    function validateForm() {
      const email = emailInput.value.trim();
      const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);

      nextBtn.disabled = !(selectedStudent && emailValid);
    }


    function showForm() {
      formView.classList.remove("hidden");
      confirmView.classList.add("hidden");
      successView.classList.add("hidden");
    }

    function showConfirm() {
      formView.classList.add("hidden");
      confirmView.classList.remove("hidden");
      successView.classList.add("hidden");
    }

    function showSuccess() {
      formView.classList.add("hidden");
      confirmView.classList.add("hidden");
      successView.classList.remove("hidden");
    }


    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        currentGroup = tab.dataset.group;
        renderStudents();
        showForm();
      });
    });


    studentSelect.addEventListener("change", () => {
      const selectedIndex = Number(studentSelect.value);

      if (studentSelect.value === "" || Number.isNaN(selectedIndex)) {
        selectedStudent = null;
      } else {
        selectedStudent = currentStudents[selectedIndex];
      }

      validateForm();
    });


    emailInput.addEventListener("input", validateForm);


    nextBtn.addEventListener("click", () => {
      if (!selectedStudent) return;

      confirmName.textContent = selectedStudent.name;
      confirmEmail.textContent = emailInput.value.trim();

      showConfirm();
    });


    backBtn.addEventListener("click", () => {
      showForm();
    });


    submitBtn.addEventListener("click", async () => {
      if (!selectedStudent) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Отправка...";

      const payload = {
        group: currentGroup,
        studentId: selectedStudent.id,
        studentName: selectedStudent.name,
        email: emailInput.value.trim()
      };

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await response.json();

        if (result.success) {
          showSuccess();
        } else {
          alert(result.error || "Не удалось отправить данные");
        }
      } catch (error) {
        console.error(error);
        alert("Ошибка сети. Попробуйте еще раз.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Отправить";
      }
    });


    resetBtn.addEventListener("click", () => {
      emailInput.value = "";
      studentSelect.value = "";
      selectedStudent = null;
      validateForm();
      showForm();
    });


    // Первая отрисовка
    renderStudents();
  </script>
