<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <title>Подтверждение email</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 20s infinite ease-in-out;
      z-index: 0;
    }

    body::before {
      width: 400px;
      height: 400px;
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 300px;
      height: 300px;
      bottom: -100px;
      right: -100px;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-30px, 30px) scale(0.9); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 28px;
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* ===== ПЛАВНЫЕ ПЕРЕХОДЫ МЕЖДУ ОКНАМИ ===== */
    .view {
      width: 100%;
    }

    .hidden {
      display: none !important;
    }

    /* Анимации выхода */
    @keyframes slideOutLeft {
      to {
        opacity: 0;
        transform: translateX(-40px);
      }
    }

    @keyframes slideOutRight {
      to {
        opacity: 0;
        transform: translateX(40px);
      }
    }

    @keyframes slideOutUp {
      to {
        opacity: 0;
        transform: translateY(-30px) scale(0.95);
      }
    }

    /* Анимации входа */
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===== ВКЛАДКИ ===== */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
      padding: 4px;
      background: #f0f2f5;
      border-radius: 14px;
    }

    .tab {
      padding: 10px 8px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tab.active {
      background: white;
      color: #667eea;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .tab:hover:not(.active) {
      color: #374151;
    }

    .tab:active {
      transform: scale(0.96);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #374151;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      background: white;
      transition: all 0.3s ease;
      outline: none;
      font-family: inherit;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    input:disabled {
      background: #f9fafb;
      cursor: not-allowed;
    }

    /* ===== КАСТОМНЫЙ DROPDOWN ===== */
    .dropdown {
      position: relative;
    }

    .dropdown-trigger {
      width: 100%;
      padding: 14px 44px 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      background: white;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #374151;
    }

    .dropdown-trigger:active {
      transform: scale(0.98);
    }

    .dropdown-trigger.open {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .dropdown-trigger::after {
      content: '';
      position: absolute;
      right: 16px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid #9ca3af;
      border-bottom: 2px solid #9ca3af;
      transform: translateY(-70%) rotate(45deg);
      transition: transform 0.3s ease;
    }

    .dropdown-trigger.open::after {
      transform: translateY(-30%) rotate(-135deg);
      border-color: #667eea;
    }

    .dropdown-trigger.placeholder {
      color: #9ca3af;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.12),
        0 0 0 1px rgba(0, 0, 0, 0.04);
      max-height: 280px;
      overflow-y: auto;
      z-index: 100;
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-overflow-scrolling: touch;
    }

    .dropdown-menu.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .dropdown-item {
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-bottom: 1px solid #f3f4f6;
      font-size: 15px;
      color: #374151;
      -webkit-tap-highlight-color: transparent;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover,
    .dropdown-item:active {
      background: #f9fafb;
    }

    .dropdown-item.selected {
      background: #eff6ff;
      color: #667eea;
      font-weight: 600;
    }

    /* ===== КНОПКИ ===== */
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-primary:not(:disabled):hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: white;
      color: #6b7280;
      border: 2px solid #e5e7eb;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      border-color: #d1d5db;
      color: #374151;
    }

    /* ===== ПОДТВЕРЖДЕНИЕ ===== */
    .confirm-box {
      background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid #e5e7eb;
    }

    .confirm-row {
      display: flex;
      align-items: center;
      padding: 14px;
      margin-bottom: 10px;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: 2px solid transparent;
    }

    .confirm-row:last-child {
      margin-bottom: 0;
    }

    .confirm-row:hover {
      background: #f9fafb;
    }

    .confirm-row.checked {
      border-color: #667eea;
      background: #eff6ff;
    }

    .confirm-row:active {
      transform: scale(0.99);
    }

    .checkbox-wrapper {
      position: relative;
      flex-shrink: 0;
      margin-right: 12px;
    }

    .checkbox-wrapper input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .checkmark {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid #d1d5db;
      border-radius: 6px;
      background: white;
      transition: all 0.2s ease;
      position: relative;
      flex-shrink: 0;
    }

    .confirm-row.checked .checkmark {
      background: #667eea;
      border-color: #667eea;
    }

    .checkmark::after {
      content: '';
      position: absolute;
      left: 7px;
      top: 3px;
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0);
      opacity: 0;
      transition: all 0.2s ease;
    }

    .confirm-row.checked .checkmark::after {
      transform: rotate(45deg) scale(1);
      opacity: 1;
    }

    .confirm-content {
      flex: 1;
      min-width: 0;
    }

    .confirm-label {
      display: block;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 2px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .confirm-value {
      display: block;
      font-size: 15px;
      color: #1a1a2e;
      font-weight: 500;
      word-break: break-word;
    }

    /* ===== УСПЕХ ===== */
    .success-box {
      text-align: center;
      padding: 20px 0;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
      animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes successPop {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    .success-icon svg {
      width: 40px;
      height: 40px;
      stroke: white;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawCheck 0.5s 0.3s forwards ease-out;
    }

    @keyframes drawCheck {
      to {
        stroke-dashoffset: 0;
      }
    }

    .success-title {
      color: #1a1a2e;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .success-subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .note {
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        align-items: flex-start;
        padding-top: 24px;
      }

      .card {
        padding: 24px 20px;
        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 24px;
      }

      .tab {
        font-size: 12px;
        padding: 9px 6px;
      }

      .dropdown-menu {
        max-height: 240px;
      }

      .confirm-row {
        padding: 12px;
      }

      .confirm-value {
        font-size: 14px;
      }
    }

    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .dropdown-menu::-webkit-scrollbar {
      width: 6px;
    }

    .dropdown-menu::-webkit-scrollbar-track {
      background: transparent;
    }

    .dropdown-menu::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 3px;
    }

    .dropdown-menu::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }
  </style>
</head>

    </div>
  </div>

        { id: "27", name: "СОМАЛЮК Ярослав Александрович" },

      "3ИСиП-24": [

        { id: "8", name: "ИВАНОВА Елизавета Александровна" },
        { id: "9", name: "ИВАНОВА Ольга Андреевна" },
        { id: "10", name: "КУЛИКОВА Виктория Алексеевна" },
        { id: "11", name: "КУШЕКБАЕВА Кира Юрьевна" },
        { id: "12", name: "ЛЕБЕДЕВ Михаил Сергеевич" },
        { id: "13", name: "ЛЕОНОВ Дмитрий Максимович" },
        { id: "14", name: "МОЛЧАНОВА Маргарита Михайловна" },
        { id: "15", name: "МЯКИШЕВ Даниил Сергеевич" },
        { id: "16", name: "НЕВИДИМОВА Кристина Максимовна" },
        { id: "17", name: "НОВИЧКОВ Силантий Андреевич" },
        { id: "18", name: "ПАВЛОВА Анастасия Олеговна" },
        { id: "19", name: "ПИРВА Денис Сергеевич" },
        { id: "20", name: "РУДЕНКО Александр Александрович" },
        { id: "21", name: "РУЗМЕТОВ Тимур Русланович" },
        { id: "22", name: "САНЗУЕВА Туяна Санжасуруновна" },
        { id: "23", name: "СКАЧКОВ Роман Николаевич" },
        { id: "24", name: "СМИРНОВА Дарья Владимировна" },
        { id: "25", name: "СОЛДАТОВА Ксения Павловна" },
        { id: "26", name: "ТВЕРСКОВ Виталий Михайлович" },
        { id: "27", name: "ТОЛМАЧЕВ Степан Игоревич" },
        { id: "28", name: "ХАЗАГАЕВА Юлия Владимировна" },
        { id: "29", name: "ЦВЕТИНСКИХ Александр Константинович" },
        { id: "30", name: "ЭПОВ Никита Сергеевич" }
      ]
    };

    // === Состояние ===
    let currentGroup = "3ИСиП-24";
    let currentStudents = [];
    let selectedStudent = null;
    let isAnimating = false; // Защита от множественных кликов во время анимации

    // === DOM ===
    const tabs = document.querySelectorAll(".tab");
    const formView = document.getElementById("formView");
    const confirmView = document.getElementById("confirmView");
    const successView = document.getElementById("successView");

    const dropdownTrigger = document.getElementById("dropdownTrigger");
    const dropdownMenu = document.getElementById("dropdownMenu");

    const emailInput = document.getElementById("emailInput");
    const nextBtn = document.getElementById("nextBtn");
    const backBtn = document.getElementById("backBtn");
    const submitBtn = document.getElementById("submitBtn");

    const confirmName = document.getElementById("confirmName");
    const confirmEmail = document.getElementById("confirmEmail");

    const confirmRowName = document.getElementById("confirmRowName");
    const confirmRowEmail = document.getElementById("confirmRowEmail");
    const checkName = document.getElementById("checkName");
    const checkEmail = document.getElementById("checkEmail");

    // === ФУНКЦИЯ ПЛАВНОГО ПЕРЕХОДА МЕЖДУ ОКНАМИ ===
    // direction: 'forward' (вперёд), 'backward' (назад), 'success' (финальный успех)
    function switchView(from, to, direction = 'forward') {
      if (isAnimating) return;
      if (from === to) return;
      
      isAnimating = true;

      let outAnim, inAnim;
      const duration = 400;

      if (direction === 'forward') {
        outAnim = 'slideOutLeft';
        inAnim = 'slideInRight';
      } else if (direction === 'backward') {
        outAnim = 'slideOutRight';
        inAnim = 'slideInLeft';
      } else if (direction === 'success') {
        outAnim = 'slideOutUp';
        inAnim = 'scaleIn';
      }

      // Анимируем выход текущего окна
      from.style.animation = `${outAnim} ${duration}ms forwards cubic-bezier(0.4, 0, 0.2, 1)`;

      setTimeout(() => {
        from.classList.add('hidden');
        from.style.animation = '';

        // Показываем новое окно и анимируем его появление
        to.classList.remove('hidden');
        to.style.animation = `${inAnim} ${duration}ms forwards cubic-bezier(0.4, 0, 0.2, 1)`;

        setTimeout(() => {
          to.style.animation = '';
          isAnimating = false;
        }, duration);
      }, duration);
    }

    // === ФУНКЦИИ ===

    function normalizeStudents(group) {
      const rawList = STUDENTS[group] || [];

      return rawList.map((item, index) => {
        if (typeof item === "string") {
          return {
            id: item,
            name: item
          };
        }

        return {
          id: String(item.id ?? item.number ?? item.num ?? item.name ?? index + 1),
          name: String(item.name ?? item.fio ?? item.fullName ?? "")
        };
      }).filter(item => item.name.trim() !== "");
    }

    function renderStudents() {
      currentStudents = normalizeStudents(currentGroup);
      selectedStudent = null;

      dropdownTrigger.textContent = "-- Выберите ФИО --";
      dropdownTrigger.classList.add("placeholder");
      dropdownTrigger.classList.remove("open");

      dropdownMenu.innerHTML = "";

      currentStudents.forEach((student, index) => {
        const item = document.createElement("div");
        item.className = "dropdown-item";
        item.dataset.index = index;
        item.textContent = student.name;

        item.addEventListener("click", () => selectStudent(index, item));

        dropdownMenu.appendChild(item);
      });

      validateForm();
    }

    function selectStudent(index, element) {
      selectedStudent = currentStudents[index];

      dropdownMenu.querySelectorAll(".dropdown-item").forEach(el => {
        el.classList.remove("selected");
      });
      element.classList.add("selected");

      dropdownTrigger.textContent = selectedStudent.name;
      dropdownTrigger.classList.remove("placeholder");
      closeDropdown();

      validateForm();
    }

    function toggleDropdown() {
      if (dropdownMenu.classList.contains("open")) {
        closeDropdown();
      } else {
        openDropdown();
      }
    }

    function openDropdown() {
      dropdownMenu.classList.add("open");
      dropdownTrigger.classList.add("open");
    }

    function closeDropdown() {
      dropdownMenu.classList.remove("open");
      dropdownTrigger.classList.remove("open");
    }

    function validateForm() {
      const email = emailInput.value.trim();
      const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
      const studentSelected = selectedStudent !== null;

      nextBtn.disabled = !(studentSelected && emailValid);
    }

    function updateSubmitButton() {
      submitBtn.disabled = !(checkName.checked && checkEmail.checked);
    }

    function resetConfirmCheckboxes() {
      checkName.checked = false;
      checkEmail.checked = false;
      confirmRowName.classList.remove("checked");
      confirmRowEmail.classList.remove("checked");
      updateSubmitButton();
    }

    // === ОБРАБОТЧИКИ ===

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentGroup = tab.dataset.group;
        renderStudents();
      });
    });

    dropdownTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleDropdown();
    });

    document.addEventListener("click", (e) => {
      if (!dropdownTrigger.contains(e.target) && !dropdownMenu.contains(e.target)) {
        closeDropdown();
      }
    });

    emailInput.addEventListener("input", validateForm);

    // Переход на подтверждение (forward)
    nextBtn.addEventListener("click", () => {
      if (!selectedStudent) return;

      confirmName.textContent = selectedStudent.name;
      confirmEmail.textContent = emailInput.value.trim();
      resetConfirmCheckboxes();

      switchView(formView, confirmView, 'forward');
    });

    // Возврат назад (backward)
    backBtn.addEventListener("click", () => {
      switchView(confirmView, formView, 'backward');
    });

    // Чекбоксы подтверждения
    confirmRowName.addEventListener("click", (e) => {
      if (e.target.tagName !== "A" && e.target.tagName !== "BUTTON") {
        checkName.checked = !checkName.checked;
        confirmRowName.classList.toggle("checked", checkName.checked);
        updateSubmitButton();
      }
    });

    confirmRowEmail.addEventListener("click", (e) => {
      if (e.target.tagName !== "A" && e.target.tagName !== "BUTTON") {
        checkEmail.checked = !checkEmail.checked;
        confirmRowEmail.classList.toggle("checked", checkEmail.checked);
        updateSubmitButton();
      }
    });

    checkName.addEventListener("click", (e) => e.stopPropagation());
    checkEmail.addEventListener("click", (e) => e.stopPropagation());

    checkName.addEventListener("change", () => {
      confirmRowName.classList.toggle("checked", checkName.checked);
      updateSubmitButton();
    });

    checkEmail.addEventListener("change", () => {
      confirmRowEmail.classList.toggle("checked", checkEmail.checked);
      updateSubmitButton();
    });

    // Отправка данных
    submitBtn.addEventListener("click", async () => {
      if (!selectedStudent || isAnimating) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Отправка...';

      const payload = {
        group: currentGroup,
        studentId: selectedStudent.id,
        studentName: selectedStudent.name,
        email: emailInput.value.trim()
      };

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await response.json();

        if (result.success) {
          // Переход на экран успеха (особая анимация)
          switchView(confirmView, successView, 'success');
        } else {
          alert(result.error || "Не удалось отправить данные");
          submitBtn.disabled = false;
          submitBtn.textContent = "Отправить";
        }
      } catch (error) {
        console.error(error);
        alert("Ошибка сети. Попробуйте еще раз.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Отправить";
      }
    });

    // Первая отрисовка
    renderStudents();
  </script>
