<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение Email</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #666; font-weight: bold; transition: 0.3s; border-bottom: 3px solid transparent; }
        .tab.active { color: #007bff; border-bottom: 3px solid #007bff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        select:focus, input:focus { outline: none; border-color: #007bff; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #0056b3; }
        .confirm-view { text-align: center; }
        .confirm-view p { font-size: 18px; margin: 10px 0; color: #333; }
        .confirm-view .label { font-weight: bold; color: #555; }
        .success-msg { color: green; font-weight: bold; text-align: center; font-size: 18px; margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Введите ваш Email</h2>
    
    <!-- Вкладки групп -->
    <div class="tabs">
        <div class="tab active" data-group="3ИСиП-24">3ИСиП-24</div>
        <div class="tab" data-group="3КСК-24">3КСК-24</div>
        <div class="tab" data-group="3РЗ-24">3РЗ-24</div>
    </div>

    <!-- Форма ввода -->
    <div id="formView">
        <div class="form-group">
            <label for="studentSelect">Ваши ФИО:</label>
            <select id="studentSelect">
                <option value="">-- Выберите ФИО --</option>
            </select>
        </div>
        <div class="form-group">
            <label for="emailInput">Ваш Email:</label>
            <input type="email" id="emailInput" placeholder="example@mail.ru">
        </div>
        <button id="nextBtn" disabled>Далее</button>
    </div>

    <!-- Экран подтверждения -->
    <div id="confirmView" class="confirm-view hidden">
        <p><span class="label">Ваше ФИО:</span> <span id="confirmName"></span></p>
        <p><span class="label">Ваш Email:</span> <span id="confirmEmail"></span></p>
        <br>
        <button id="submitBtn">Отправить</button>
        <br><br>
        <button id="backBtn" style="background: #6c757d;">Назад (Изменить)</button>
    </div>

    <!-- Сообщение об успехе -->
    <div id="successView" class="hidden">
        <div class="success-msg">✅ Данные успешно отправлены!</div>
    </div>
</div>

<script>
    // ВСТАВЬТЕ СЮДА URL ИЗ GOOGLE APPS SCRIPT (Шаг 2)
    const WEB_APP_URL = "ВСТАВЬТЕ_СЮДА_URL_ИЗ_ШАГА_2";

    let currentGroup = "3ИСиП-24";
    let selectedStudentId = "";
    let selectedStudentName = "";

    const tabs = document.querySelectorAll('.tab');
    const studentSelect = document.getElementById('studentSelect');
    const emailInput = document.getElementById('emailInput');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const backBtn = document.getElementById('backBtn');
    
    const formView = document.getElementById('formView');
    const confirmView = document.getElementById('confirmView');
    const successView = document.getElementById('successView');

    // Переключение вкладок
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentGroup = tab.getAttribute('data-group');
            loadStudents();
        });
    });

    // Загрузка студентов из Google Таблицы
    async function loadStudents() {
        studentSelect.innerHTML = '<option value="">-- Загрузка... --</option>';
        try {
            const response = await fetch(`${WEB_APP_URL}?group=${encodeURIComponent(currentGroup)}`);
            const students = await response.json();
            
            studentSelect.innerHTML = '<option value="">-- Выберите ФИО --</option>';
            students.forEach(s => {
                const option = document.createElement('option');
                option.value = s.id;
                option.textContent = s.name;
                studentSelect.appendChild(option);
            });
        } catch (error) {
            studentSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
            console.error(error);
        }
        validateForm();
    }

    // Валидация формы (разблокировка кнопки)
    function validateForm() {
        const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
        const isStudentSelected = studentSelect.value !== "";
        nextBtn.disabled = !(isEmailValid && isStudentSelected);
    }

    studentSelect.addEventListener('change', () => {
        selectedStudentId = studentSelect.value;
        selectedStudentName = studentSelect.options[studentSelect.selectedIndex].text;
        validateForm();
    });

    emailInput.addEventListener('input', validateForm);

    // Переход к подтверждению
    nextBtn.addEventListener('click', () => {
        document.getElementById('confirmName').textContent = selectedStudentName;
        document.getElementById('confirmEmail').textContent = emailInput.value;
        formView.classList.add('hidden');
        confirmView.classList.remove('hidden');
    });

    // Возврат к редактированию
    backBtn.addEventListener('click', () => {
        confirmView.classList.add('hidden');
        formView.classList.remove('hidden');
    });

    // Отправка данных в Google Таблицу
    submitBtn.addEventListener('click', async () => {
        submitBtn.disabled = true;
        submitBtn.textContent = "Отправка...";

        const payload = {
            group: currentGroup,
            studentId: selectedStudentId,
            email: emailInput.value
        };

        try {
            // redirect: 'follow' обязателен для Google Apps Script
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                redirect: 'follow' 
            });
            
            const result = await response.json();
            
            if (result.success) {
                confirmView.classList.add('hidden');
                successView.classList.remove('hidden');
            } else {
                alert("Ошибка: " + (result.error || "Неизвестная ошибка"));
                submitBtn.disabled = false;
                submitBtn.textContent = "Отправить";
            }
        } catch (error) {
            alert("Ошибка сети. Попробуйте еще раз.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Отправить";
        }
    });

    // Инициализация при загрузке страницы
    loadStudents();
</script>

</body>
</html>
